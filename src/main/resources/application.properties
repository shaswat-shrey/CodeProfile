spring.application.name=coding_tracker

info.app.name=Coding Tracker
info.app.version=1.0.0
info.app.description=Multi-platform coding analytics platform

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coding_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# JWT CONFIGURATION
# ==========================================

app.secret-key=${JWT_SECRET:default_unsecure_key_that_is_long_enough_to_not_crash}
app.jwt-expiration=86400000

# Show all debug logs for the security package
logging.level.com.abi.coding_tracker.security=DEBUG


#management endpoint configuration
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==========================================
# SPRING MAIL CONFIGURATION
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# REDIS CONFIGURATION
# ==========================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.password=${REDIS_PASSWORD:}

# ==========================================
# RESILIENCE4J (CIRCUIT BREAKER & RETRY)
# ==========================================

resilience4j.circuitbreaker.instances.leetcode.register-health-indicator=true
resilience4j.circuitbreaker.instances.leetcode.sliding-window-size=10
resilience4j.circuitbreaker.instances.leetcode.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.leetcode.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.leetcode.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.leetcode.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.leetcode.max-attempts=3
resilience4j.retry.instances.leetcode.wait-duration=500ms


# ==========================================
# SCHEDULED SYNCHRONIZATION
# ==========================================
# To test this quickly, change delay to 60000 (1 minute)
sync.scheduler.enabled=${SYNC_SCHEDULER_ENABLED:true}
sync.scheduler.delay=${SYNC_SCHEDULER_DELAY:21600000}